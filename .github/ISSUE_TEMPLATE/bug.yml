name: Report a bug
description: Something on flutter.ph looks wrong or is broken.
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: page
    attributes: { label: Page URL }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device and browser, placeholder: "iPhone 15, Safari" }
